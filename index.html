<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактор документов практики</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>Редактор документов производственной практики</h1>
    </header>

    <section id="section-upload">
      <h2>1. Загрузка шаблонов</h2>
      <div class="upload-tip">
        <button id="btn-load-folder" class="btn btn-primary">Загрузить из папки templates</button>
        <span class="tip-text">Шаблоны должны лежать в папке templates на сервере</span>
      </div>
      <div id="upload-status" class="status-msg"></div>
    </section>

    <section id="section-data">
      <h2>2. Данные магистранта</h2>
      <div class="form-grid">
        <div class="form-field">
          <label for="input-student-fio">ФИО магистранта:</label>
          <input type="text" id="input-student-fio" placeholder="Иванов Иван Иванович">
        </div>
        <div class="form-field">
          <label for="input-supervisor-fio">ФИО руководителя:</label>
          <input type="text" id="input-supervisor-fio" placeholder="Петров Пётр Петрович">
        </div>
        <div class="form-field">
          <label for="input-date-start">Дата начала:</label>
          <input type="text" id="input-date-start" placeholder="01.09.2025">
        </div>
        <div class="form-field">
          <label for="input-date-end">Дата окончания:</label>
          <input type="text" id="input-date-end" placeholder="30.12.2025">
        </div>
        <div class="form-field form-field-narrow">
          <label for="input-semester">Семестр:</label>
          <input type="number" id="input-semester" value="1" min="1" max="3">
        </div>
      </div>
    </section>

    <section id="section-scores">
      <h2>3. Баллы <span id="section-scores-note" class="note"></span></h2>
      <div id="scores-container">
        <p class="placeholder-msg">Загрузите шаблон оценочного листа, чтобы появились поля для баллов.</p>
      </div>
    </section>

    <section id="section-results">
      <h2>4. Результаты</h2>
      <div id="results-container">
        <div id="results-stage">
          <h3>Этапы практики</h3>
          <div id="stage-results"></div>
        </div>
        <div id="results-competence">
          <h3>Компетенции</h3>
          <div id="comp-results"></div>
        </div>
        <div id="results-final">
          <h3>Итог практики</h3>
          <div id="final-result"></div>
        </div>
      </div>
    </section>

    <section id="section-generate">
      <h2>5. Документы</h2>
      <div class="generate-actions">
        <button id="btn-generate-all" class="btn btn-primary btn-large">Скачать все документы</button>
        <div class="generate-grid">
          <button class="btn btn-secondary" data-doc="eval">Оценочный лист</button>
          <button class="btn btn-secondary" data-doc="comp">Лист компетенций</button>
          <button class="btn btn-secondary" data-doc="review">Отзыв</button>
          <button class="btn btn-secondary" data-doc="task">Индивидуальное задание</button>
          <button class="btn btn-secondary" data-doc="plan">План-график</button>
        </div>
      </div>
      <div id="generate-status" class="status-msg"></div>
    </section>
  </div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/templateLoader.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/docxBuilder.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
